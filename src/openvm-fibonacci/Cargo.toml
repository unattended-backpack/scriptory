# Standalone workspace for the OpenVM fibonacci demo client, mirroring the
# sp1-fibonacci and risc0-fibonacci subtrees. The guest/ subdirectory is
# excluded from *this* workspace because it cross-compiles to the OpenVM
# riscv32im-risc0-zkvm-elf target (OpenVM reuses the risc0 rustc target to
# get a std-capable Tier 3 RISC-V target) and cannot be built with the host
# toolchain.
[workspace]
members = ["host"]
exclude = ["guest"]
resolver = "2"
